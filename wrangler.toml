name = "sub-worker"
main = "_worker.js"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat"]

# =============================================================
# 注意：当前通过 API / Pages 部署，wrangler 非必需。
# 环境变量在 Cloudflare Dashboard → Worker → 设置 → 环境变量 中配置。
# =============================================================
#
# 需要设置的变量：
#   TOKEN    — 访问令牌（必填）
#   LINK     — 节点链接，一行一条 vless://（必填）
#   SUBNAME  — 订阅名称（可选，默认 "自用"）
